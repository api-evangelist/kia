openapi: 3.2.0
info:
  title: KIA Developers Connected Car 계정 API
  version: v1
  description: 'Kia connected-car data API (Korea) published on KIA Developers: OAuth2 account APIs, consent APIs, and vehicle profile, status and warning-lamp data. GENERATED by API Evangelist from the provider documentation markdown served by developer.kia.com/api/v1/specification/contents/{group}/{api}; not a provider-published contract.'
  x-generated-from: documentation
  x-ae-authored: true
  x-last-validated: '2026-10-13'
servers:
- url: https://prd.kr-ccapi.kia.com
  description: Production (per docs)
- url: https://dev.kr-ccapi.kia.com
  description: Development (docs domain substitution)
tags:
- name: 계정 API
paths:
  /api/v1/user/oauth2/authorize:
    get:
      operationId: account_authorize
      summary: 로그인 인증 요청
      description: 기아자동차 통합 계정은 OAuth 2.0을 지원합니다. 사용자 로그인 후 권한 동의 결과에 따라 Redirect URL로 Authorization Code(인증 코드)를 전달합니다. Redirect URL은 '설정 - 계정 API' 페이지에서 등록 가능합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_authorize
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
        description: code로 입력
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션 등록 시 발급 받은 Client ID
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션 등록 시 설정한 Redirect URL
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션에서 생성한 상태 토큰 값 사이트 간 요청 위조(cross-site request forgery) 공격을 방지하기 위해 사용 특수문자 사용 시, Base64 혹은 URL Encoding 필수
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 로그인 인증 성공 시 발급된 인증 코드 사용자 토큰 발급에 사용
                  state:
                    type: string
                    description: 애플리케이션에서 요청한 상태 토큰 값
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
  /api/v1/user/profile:
    get:
      operationId: account_profile
      summary: 사용자 정보 조회
      description: 사용자에 대한 정보를 조회합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_profile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 당사 발급 사용자 고유 식별자
                  email:
                    type: string
                    description: 이메일(가입 ID)
                  name:
                    type: string
                    description: 이름
                  mobileNum:
                    type: string
                    description: 휴대폰번호
                  birthdate:
                    type: string
                    description: 생년월일
                  lang:
                    type: string
                    description: '언어코드 (ko: 국문, en: 영문, zh: 중문)'
                  social:
                    type: boolean
                    description: 소셜로그인 등록 여부
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
  /api/v1/user/oauth2/token:
    post:
      operationId: account_token
      summary: 사용자 토큰 발급/갱신/삭제 요청
      description: API 호출에 필요한 사용자 토큰을 발급/갱신/삭제하기 위한 API입니다. access_token은 발급 후 24시간, refresh_token은 1년간 유효합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: '인증 구분 값 1) 발급: authorization\_code 2) 갱신: refresh\_token 3) 삭제: delete'
                code:
                  type: string
                  description: 로그인 인증 요청 API 호출 후 발급 받은 인증 코드 값
                redirect_uri:
                  type: string
                  description: 애플리케이션 등록 시 설정한 Redirect URL
                refresh_token:
                  type: string
                  description: Token 발급 시 응답으로 받은 갱신 토큰 값 접근 토큰(access_token) 갱신 요청 시 입력
                access_token:
                  type: string
                  description: Token 발급 시 응답으로 받은 접근 토큰 값 Token 삭제 요청 시 입력
              required:
              - grant_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: 접근 토큰
                  refresh_token:
                    type: string
                    description: 갱신 토큰, 접근 토큰(access_token) 갱신 요청 시 사용
                  token_type:
                    type: string
                    description: Bearer로 입력
                  expires_in:
                    type: string
                    description: '접근 토큰(access_token) 유효 기간(단위: 초)'
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from /api/v1/user/oauth2/token
externalDocs:
  url: https://developer.kia.com/web/v1/kia/specification/account
