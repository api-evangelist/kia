openapi: 3.1.0
info:
  title: KIA Developers Connected Car API
  version: v1
  description: 'Kia connected-car data API (Korea) published on KIA Developers: OAuth2 account APIs, consent APIs, and vehicle
    profile, status and warning-lamp data. GENERATED by API Evangelist from the provider documentation markdown served by
    developer.kia.com/api/v1/specification/contents/{group}/{api}; not a provider-published contract.'
  x-generated-from: documentation
  x-ae-authored: true
  x-last-validated: '2026-10-13'
externalDocs:
  url: https://developer.kia.com/web/v1/kia/specification/account
servers:
- url: https://prd.kr-ccapi.kia.com
  description: Production (per docs)
- url: https://dev.kr-ccapi.kia.com
  description: Development (docs domain substitution)
paths:
  /api/v1/user/oauth2/authorize:
    get:
      operationId: account_authorize
      summary: 로그인 인증 요청
      description: 기아자동차 통합 계정은 OAuth 2.0을 지원합니다. 사용자 로그인 후 권한 동의 결과에 따라 Redirect URL로 Authorization Code(인증 코드)를 전달합니다. Redirect
        URL은 '설정 - 계정 API' 페이지에서 등록 가능합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_authorize
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
        description: code로 입력
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션 등록 시 발급 받은 Client ID
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션 등록 시 설정한 Redirect URL
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: 애플리케이션에서 생성한 상태 토큰 값 사이트 간 요청 위조(cross-site request forgery) 공격을 방지하기 위해 사용 특수문자 사용 시, Base64 혹은 URL
          Encoding 필수
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 로그인 인증 성공 시 발급된 인증 코드 사용자 토큰 발급에 사용
                  state:
                    type: string
                    description: 애플리케이션에서 요청한 상태 토큰 값
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
  /api/v1/user/profile:
    get:
      operationId: account_profile
      summary: 사용자 정보 조회
      description: 사용자에 대한 정보를 조회합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_profile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 당사 발급 사용자 고유 식별자
                  email:
                    type: string
                    description: 이메일(가입 ID)
                  name:
                    type: string
                    description: 이름
                  mobileNum:
                    type: string
                    description: 휴대폰번호
                  birthdate:
                    type: string
                    description: 생년월일
                  lang:
                    type: string
                    description: '언어코드 (ko: 국문, en: 영문, zh: 중문)'
                  social:
                    type: boolean
                    description: 소셜로그인 등록 여부
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
  /api/v1/user/oauth2/token:
    post:
      operationId: account_token
      summary: 사용자 토큰 발급/갱신/삭제 요청
      description: API 호출에 필요한 사용자 토큰을 발급/갱신/삭제하기 위한 API입니다. access_token은 발급 후 24시간, refresh_token은 1년간 유효합니다.
      tags:
      - 계정 API
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/account/account_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: '인증 구분 값 1) 발급: authorization\_code 2) 갱신: refresh\_token 3) 삭제: delete'
                code:
                  type: string
                  description: 로그인 인증 요청 API 호출 후 발급 받은 인증 코드 값
                redirect_uri:
                  type: string
                  description: 애플리케이션 등록 시 설정한 Redirect URL
                refresh_token:
                  type: string
                  description: Token 발급 시 응답으로 받은 갱신 토큰 값 접근 토큰(access_token) 갱신 요청 시 입력
                access_token:
                  type: string
                  description: Token 발급 시 응답으로 받은 접근 토큰 값 Token 삭제 요청 시 입력
              required:
              - grant_type
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: 접근 토큰
                  refresh_token:
                    type: string
                    description: 갱신 토큰, 접근 토큰(access_token) 갱신 요청 시 사용
                  token_type:
                    type: string
                    description: Bearer로 입력
                  expires_in:
                    type: string
                    description: '접근 토큰(access_token) 유효 기간(단위: 초)'
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
  /api/v1/car/profile/carlist:
    get:
      operationId: carprofile_carlist
      summary: 내 차량 리스트 조회
      description: 사용자가 소유하고 있는 차량 리스트를 조회합니다. 로그인 시점 접근 권한을 승인한 차량만 조회 가능합니다.
      tags:
      - 차량 데이터
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/carprofile_carlist
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cars:
                    type: object
                    description: 차량 리스트
                    properties:
                      carId:
                        type: string
                        description: 당사 발급 차량 고유 식별자
                      carNickname:
                        type: string
                        description: 사용자가 커넥티드 서비스 앱에서 설정한 닉네임
                      carType:
                        type: string
                        description: '차량 타입 (GN:내연기관, EV:전기, HEV:하이브리드, PHEV: 플러그인하이브리드, FCEV:수소전기)'
                      carSellname:
                        type: string
                        description: 차량 판매 모델명
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/profile/{carId}/contract:
    get:
      operationId: carprofile_contract
      summary: 커넥티드 서비스 가입일/무료 종료일 조회
      description: 차량의 커넥티드 서비스(KIA Connect) 가입일과 무료 서비스 종료일 정보를 조회합니다. 2020년 기준 신차 구입 이후 최초 서비스 가입에 한해 5년 동안 무료 서비스가 제공됩니다.
      tags:
      - 차량 데이터
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/carprofile_contract
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: string
        description: 당사 발급 차량 고유 식별자
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscribeDate:
                    type: string
                    description: 커넥티드 서비스 가입일(YYYYMMDD) (date)
                  endDate:
                    type: string
                    description: 무료 서비스 종료일(YYYYMMDD) (date)
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car-service/terms/agreement:
    post:
      operationId: service_agreement
      summary: 개인정보 제공 동의 요청
      description: 사용자에게 개인정보 제 3자 제공 동의 페이지를 연결하기 위한 API입니다. 사용자 동의 시, Redirect URL로 userId, state 값이 전달됩니다.
      tags:
      - 개인정보 제공 동의 및 철회
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/service_agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Bearer {access_token}
                state:
                  type: string
                  description: 애플리케이션에서 요청한 상태 토큰 값
              required:
              - token
              - state
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    description: 당사 발급 사용자 고유 식별자
                  state:
                    type: string
                    description: 애플리케이션에서 요청한 상태 토큰 값
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties: {}
      security:
      - bearerAuth: []
  /api/v1/car-service/terms/reject:
    get:
      operationId: service_termreject
      summary: 개인정보 제공 철회 요청
      description: 개인정보 제3자 제공 동의 여부가 미동의 상태로 변경되었을 때, 이 정보를 Developers 서버에 업데이트하기 위한 API입니다.
      tags:
      - 개인정보 제공 동의 및 철회
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/service_termreject
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/status/{carId}/dte:
    get:
      operationId: status_dte
      summary: 주행 가능 거리 조회
      description: 차량의 주행 가능 거리를 조회하는 API 입니다. 시동 종료 시점을 기준으로 업데이트되며, 2개월 미운행 차량의 데이터는 조회 불가합니다.
      tags:
      - 차량 상태
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/status_dte
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: string
        description: 당사 발급 차량 고유 식별자
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    description: 차량 전송 시간(YYYYMMDDHHmmSS) (datetime)
                  value:
                    type: number
                    description: 거리 수치
                  unit:
                    type: number
                    description: '단위(0: feet, 1: km, 2: meter, 3: miles)'
                  phevTotalValue:
                    type: number
                    description: PHEV 차량의 Battery + Engine 주행가능거리 거리 수치
                  phevTotalUnit:
                    type: number
                    description: 'PHEV 차량의 Battery + Engine 주행가능거리 단위(0: feet, 1: km, 2: meter, 3: miles)'
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/status/{carId}/ev/battery:
    get:
      operationId: status_evbattery
      summary: 전기차 배터리 잔량 조회
      description: 전기차 차량의 배터리 잔량 정보를 조회하는 API입니다.
      tags:
      - 차량 상태
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/status_evbattery
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: string
        description: 당사 발급 차량 고유 식별자
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  soc:
                    type: number
                    description: '배터리 잔량(단위: %)'
                  timestamp:
                    type: string
                    description: 차량 전송 시간 (datetime)
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/status/{carId}/ev/charging:
    get:
      operationId: status_evcharging
      summary: 전기차 충전 상태 조회
      description: 전기차 차량의 충전 중 정보를 조회하는 API입니다.
      tags:
      - 차량 상태
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/status_evcharging
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: string
        description: 당사 발급 차량 고유 식별자
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  batteryPlugin:
                    type: number
                    description: '플러그 연결 여부 (0: 연결 안됨, 1: 급속 충전기 연결, 2: 일반 충전기 연결)'
                  batteryCharge:
                    type: boolean
                    description: 충전 여부
                  soc:
                    type: number
                    description: '배터리 잔량(단위: %)'
                  targetSOC:
                    type: object
                    description: 목표 충전 설정값
                    properties:
                      plugType:
                        type: number
                        description: '충전기 타입 (0 : DC charger, 1 : AC w/ 240V, 2 : AC w/ 120V)'
                      targetSOClevel:
                        type: number
                        description: 충전 목표 배터리 잔량
                  remainTime:
                    type: object
                    description: '목표 충전까지 남은 시간 -충전 연결 상태: 잔여 충전 시간 - 충전 미연결 상태: 240V 충전 시 잔여 충전 시간'
                    properties:
                      value:
                        type: number
                        description: 시간 간격 수치
                      unit:
                        type: number
                        description: '단위 (0: hour, 1: min, 2: msec, 3: sec)'
                  timestamp:
                    type: string
                    description: 차량 전송 시간 (datetime)
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/status/{carId}/odometer:
    get:
      operationId: status_odometer
      summary: 누적 운행 거리 조회
      description: 차량의 누적 운행 거리를 조회하는 API 입니다. 시동 종료 시점을 기준으로 업데이트됩니다.
      tags:
      - 차량 상태
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/status_odometer
      parameters:
      - name: carId
        in: path
        required: true
        schema:
          type: string
        description: 당사 발급 차량 고유 식별자
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  odometers:
                    type: object
                    description: 누적 운행 거리
                    properties:
                      date:
                        type: string
                        description: 조회일자(YYYYMMDD) (date)
                      timestamp:
                        type: string
                        description: 차량 전송 시간(YYYYMMDDHHmmSS) (datetime)
                      value:
                        type: number
                        description: 거리 수치 (소수점 절사)
                      unit:
                        type: number
                        description: '단위 (0: feet, 1: km, 2: meter, 3: miles)'
                  msgId:
                    type: string
                    description: 요청 결과 확인을 위한 메시지 ID
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errCode:
                    type: string
                    description: 에러 코드
                  errMsg:
                    type: string
                    description: 에러에 대한 상세 설명
                  errId:
                    type: string
                    description: 에러 ID
      security:
      - bearerAuth: []
  /api/v1/car/status/warning/{carId}/breakOil:
    get:
      operationId: statuswarning_breakoil
      summary: 브레이크 오일 경고등 상태 조회
