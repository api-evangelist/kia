webhooks:
  partner_deletecallback:
    post:
      operationId: partner_deletecallback
      summary: 데이터 조회 불가 상태 알림
      description: 디지털키 서비스 예약결과 전달 또는 커넥티드 서비스 해지, 차량 삭제, 제3자 제공 동의 철회 등 고객 요청에 의한 예약 결과값이나 요청에 의해 데이터를 더 이상 제공할 수 없는 경우,
        이 정보를 전달받기 위한 규격입니다 Callback URL은 '설정 - 데이터 API' 페이지에서 등록 가능합니다. 개인정보보호법 및 개인정보보호법시행령에 따라 해당 알림을 받은 즉시, API를 통해 제공된
        데이터를 일괄 삭제하고 서비스에서 지속 표출되지 않도록 조치해야 합니다.
      tags:
      - 파트너사 서비스
      x-docs-url: https://developer.kia.com/web/v1/kia/specification/data/partner_deletecallback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: 알림 대상 (account, vehicle, agreement)
                  action:
                    type: string
                    description: callback event (delete, reject)
                  userId:
                    type: string
                    description: 당사 발급 사용자 고유 식별자
                  carId:
                    type: string
                    description: 당사 발급 차량 고유 식별자
                  vin:
                    type: string
                    description: VIN(차대번호) VIN(차대번호) 데이터 접근 권한이 있는 서비스에 한하여 제공
        4XX:
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from /api/v1/user/oauth2/token
